name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (also downloads Mojang's query data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Type checks
        run: pnpm typecheck
      - name: Build the web app, the VS Code extension, the desktop app and the MCP server
        run: |
          pnpm --filter @oxygen/web build
          pnpm --filter oxygen-particle-editor build
          pnpm --filter @oxygen/desktop build
          pnpm --filter @oxygen/mcp build
